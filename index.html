<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Todo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">TODAY</p>
      <h1>My Todo</h1>
      <p class="subtitle">오늘 할 일을 가볍게 정리해보세요.</p>
    </header>

    <form id="todo-form" class="todo-form">
      <label class="sr-only" for="todo-input">할 일</label>
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off" />
      <label class="sr-only" for="priority-input">우선순위</label>
      <select id="priority-input" aria-label="우선순위">
        <option value="high">높음</option>
        <option value="medium" selected>보통</option>
        <option value="low">낮음</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <div class="search-field">
      <label class="sr-only" for="search-input">할 일 검색</label>
      <input id="search-input" type="search" placeholder="할 일 검색" autocomplete="off" />
    </div>

    <div class="status-filter" aria-label="완료 상태 필터">
      <button type="button" class="active" data-filter="all">전체</button>
      <button type="button" data-filter="active">진행 중</button>
      <button type="button" data-filter="completed">완료</button>
    </div>

    <section class="todo-section" aria-label="할 일 목록">
      <ul id="todo-list" class="todo-list"></ul>
      <div id="empty-state" class="empty-state">아직 할 일이 없어요.</div>
    </section>

    <footer>
      <span id="remaining-count">0개의 할 일 남음</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
